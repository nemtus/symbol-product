name: Mirror sync (upstream symbol/product)

# Follows upstream github.com/symbol/product:dev. Unlike nemtus/symbol-networks (a content
# mirror regenerable by a patch), this repo carries real code edits (the NEMTUS mirror layer),
# so upstream arrives via a git MERGE:
#   - clean merge  -> push a sync branch and open a PR (merge with a MERGE COMMIT, not squash)
#   - conflict     -> abort, write the conflict list + resolution steps to the job summary, and
#     fail the run (Issues are disabled on this fork; the red run + Discord notify is the signal)
# The ci.yml `parity` job re-checks the mirror invariants before any sync PR can merge.
# Note: the `_symbol` submodule (linters/build-ci) fetches from the NEMTUS mirror nemtus/symbol (not
# upstream symbol/symbol); its pointer SHA is a SEPARATE sync owned by the existing Jenkins
# updateSubmodule job — not handled here. See docs/nemtus-mirror.md.
#
# Companion jobs:
#   - `keepalive` resets GitHub's 60-day scheduled-workflow auto-disable clock for every
#     scheduled workflow in this repo (incl. the upstream-derived codeql/combine files,
#     which are deliberately NOT edited). To stop a schedule permanently, DELETE its cron
#     trigger — a manual "disable workflow" would just be re-enabled by the next keepalive.
#   - `notify` pings Discord (org secret DISCORD_WEBHOOK_URL) when a scheduled run fails
#     (e.g. the conflict path above); it skips silently when the secret is not configured.

'on':
  schedule:
    - cron: '17 4 * * 1'  # weekly, Monday 04:17 UTC
  workflow_dispatch: {}

concurrency:
  group: mirror-sync
  cancel-in-progress: false

env:
  UPSTREAM_REMOTE: https://github.com/symbol/product.git
  UPSTREAM_BRANCH: dev
  LOCAL_BRANCH: dev

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Sync upstream -> PR (or issue on conflict)
        env:
          GH_TOKEN: ${{ github.token }}
          # This repo is a FORK of symbol/product, and the step below adds an `upstream` remote
          # pointing at the parent. Without GH_REPO, gh follows the fork convention and defaults the
          # PR base repo to the parent (symbol/product) — `gh pr create` then fails with
          # "Resource not accessible by integration (createPullRequest)" since this workflow's token
          # has no write access to the parent. Pin every gh call to this repo.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git remote add upstream "$UPSTREAM_REMOTE"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          UPSTREAM_SHA="$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")"

          # fast-path: our branch already contains every upstream commit
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream@${UPSTREAM_SHA}; nothing to sync."
            exit 0
          fi

          SYNC_BRANCH="sync/upstream-${UPSTREAM_SHA}"
          git checkout -b "$SYNC_BRANCH"

          if git merge --no-edit --no-ff "upstream/$UPSTREAM_BRANCH"; then
            # clean merge — always publish the merge commit (it records the upstream parent so the
            # next run's `merge-base --is-ancestor` fast-path becomes true). Do NOT skip on a
            # tree-identical merge: that would drop the parent link and replay the same range forever.
            # Plain --force (not --force-with-lease): on a re-run the sync branch can already exist on
            # origin while this runner never fetched it (checkout pulls only `dev`), so there is no
            # lease ref to compare and --force-with-lease would fail. The branch is automation-owned.
            git push -u --force origin "$SYNC_BRANCH"

            if [ -n "$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[].number')" ]; then
              echo "PR already open for $SYNC_BRANCH."
              exit 0
            fi

            BODY="$(printf '%s\n' \
              "Automated mirror sync. Merges upstream \`symbol/product:${UPSTREAM_BRANCH}\`@\`${UPSTREAM_SHA}\` into \`${LOCAL_BRANCH}\`." \
              "" \
              "**Merge this PR with a MERGE COMMIT (not squash).** Squashing drops the upstream parent, which would make every future sync replay all of upstream history as one giant diff." \
              "" \
              "The \`parity\` CI job re-checks the NEMTUS mirror invariants (\`.github/scripts/check-nemtus-mirror-invariants.sh\`). Ensure it is green before merging — if upstream touched a mirrored file, reconcile so the invariants still hold. See \`docs/nemtus-mirror.md\`.")"

            gh pr create \
              --base "$LOCAL_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "Sync upstream symbol/product:${UPSTREAM_BRANCH}@${UPSTREAM_SHA}" \
              --body "$BODY"

            # Decorative label, best-effort: attach it after creation, non-fatally. PR creation must
            # not depend on the label existing (this is an Issues-disabled fork where the workflow's
            # own token cannot create labels; `gh pr create --label` would validate up front and abort
            # the whole run if the label were absent).
            gh pr edit "$SYNC_BRANCH" --add-label upstream-sync || true
          else
            # conflict: do not auto-resolve code. This repo is an Issues-disabled fork, so we cannot
            # file a tracking issue. Instead write the conflicting files + resolution steps to the job
            # summary and fail the run — the red run (with this summary) is the signal to resolve the
            # merge manually. Nothing here depends on Issues or labels.
            CONFLICTS="$(git diff --name-only --diff-filter=U | sort)"
            # Capture the actual conflict hunks (combined diff, with markers) BEFORE aborting — after
            # `git merge --abort` they are gone. Cap the size so a large conflict can't blow the 1 MiB
            # job-summary limit; the truncation notice below fires when we hit the cap.
            CONFLICT_DIFF="$(git diff --diff-filter=U | head -c 60000)"
            git merge --abort

            {
              echo "## Upstream sync conflict: symbol/product@${UPSTREAM_SHA}"
              echo
              echo "Could not merge upstream \`symbol/product:${UPSTREAM_BRANCH}\`@\`${UPSTREAM_SHA}\` into \`${LOCAL_BRANCH}\` cleanly."
              echo
              echo "### Conflicting files"
              echo '```'
              echo "${CONFLICTS}"
              echo '```'
              echo
              echo "### Conflict hunks"
              echo '```diff'
              echo "${CONFLICT_DIFF}"
              [ "${#CONFLICT_DIFF}" -ge 60000 ] && echo "... (truncated; run the helper below to see the full diff locally)"
              echo '```'
              echo
              echo "### Resolve locally (merge commit, not squash)"
              echo "Fastest path — the helper does the mechanical steps and prints the conflict + next steps:"
              echo '```bash'
              echo "git checkout ${LOCAL_BRANCH} && git pull"
              echo "bash .github/scripts/resolve-upstream-sync.sh   # adds upstream, merges, leaves conflicts to resolve"
              echo '```'
              echo "Or by hand:"
              echo '```bash'
              echo "git checkout ${LOCAL_BRANCH} && git pull"
              echo "git remote add upstream ${UPSTREAM_REMOTE} 2>/dev/null || true"
              echo "git fetch upstream ${UPSTREAM_BRANCH}"
              echo "git checkout -b sync/upstream-${UPSTREAM_SHA}"
              echo "git merge --no-ff upstream/${UPSTREAM_BRANCH}"
              echo "# resolve conflicts, keeping the NEMTUS mirror layer (see docs/nemtus-mirror.md), then:"
              echo "bash .github/scripts/check-nemtus-mirror-invariants.sh"
              echo "git push -u origin sync/upstream-${UPSTREAM_SHA}"
              echo "gh pr create --base ${LOCAL_BRANCH} --title 'Sync upstream symbol/product:${UPSTREAM_BRANCH}@${UPSTREAM_SHA}'"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Upstream sync conflict with symbol/product@${UPSTREAM_SHA}; see the job summary for the conflicting files and resolution steps."
            exit 1
          fi

  # Reset GitHub's 60-day scheduled-workflow auto-disable clock. Covers every
  # scheduled workflow in this repo — including the upstream-derived
  # codeql-analysis.yaml / combine-dependabot-pr.yaml, which are kept unedited to
  # avoid a permanent merge-conflict surface with upstream.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable scheduled workflows (60-day inactivity guard)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in mirror-sync.yml codeql-analysis.yaml combine-dependabot-pr.yaml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable"
          done

  # Push-notification on failure — the conflict path exits 1 by design, and a red
  # scheduled run used to be the only signal. No third-party action: plain curl.
  notify:
    needs: [sync]
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Discord (mirror-sync failed)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured; skipping notification."
            exit 0
          fi
          payload="$(jq -n --arg c "[mirror-sync] ${GITHUB_REPOSITORY} failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{content: $c}')"
          curl -fsS -H 'Content-Type: application/json' -d "${payload}" "${WEBHOOK}"
