name: CI

# Pull-request gate for the NEMTUS mirror layer (tools/shoestring + lightapi/python).
# Runs the components' tests/builds and the mirror-invariant parity check before merge.
# Uses only first-party actions (SHA-pinned) + shell, so it runs even under a restrictive
# "allowed actions" policy. Other monorepo components remain on upstream Jenkins (out of scope).
#
# Deliberately NOT path-filtered, for two reasons:
#   - the `dev` ruleset makes all three jobs below REQUIRED status checks. A path-filtered workflow
#     simply does not run for a PR that misses the filter, so the checks never report and the PR is
#     blocked forever — which is what happened to every upstream sync PR that touched only other
#     monorepo components (e.g. #66, explorer/rest only).
#   - the `parity` job reads `.gitmodules` (invariant: the `_symbol` submodule must fetch from
#     nemtus/symbol), which sits outside any plausible component filter. Under the old filter an
#     upstream change to `.gitmodules` alone could revert that invariant with the gate never running.
# The whole workflow costs ~50s of wall clock (4s + 32s + 48s in parallel), so running it on every
# PR is cheaper than either problem.

'on':
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: Mirror invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Check NEMTUS mirror invariants
        run: bash .github/scripts/check-nemtus-mirror-invariants.sh

  lightapi:
    name: lightapi (test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install OpenSSL headers (cffi build)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install package (builds cffi/OpenSSL ext) + test deps
        working-directory: lightapi/python
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r dev_requirements.txt
      - name: Test
        working-directory: lightapi/python
        run: bash scripts/ci/test.sh

  shoestring:
    name: shoestring (test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install OpenSSL headers (lightapi cffi build)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install in-repo lightapi + shoestring deps
        run: |
          python -m pip install --upgrade pip build
          # install the in-repo lightapi to satisfy nemtus-symbol-lightapi (not yet on PyPI)
          # and to test shoestring against the in-repo source rather than a published wheel
          pip install ./lightapi/python
          pip install -r tools/shoestring/requirements.txt -r tools/shoestring/dev_requirements.txt
      - name: Build i18n resources
        working-directory: tools/shoestring
        run: bash scripts/ci/build.sh
      - name: Test
        working-directory: tools/shoestring
        run: bash scripts/ci/test.sh
      - name: Validate packaging
        working-directory: tools/shoestring
        run: python -m build
