name: Publish nemtus-symbol-lightapi

# Publishes the NEMTUS mirror of the Python Light API to PyPI as
# `nemtus-symbol-lightapi` (import module: symbollightapi).
# Trigger by pushing a tag like `nemtus-symbol-lightapi@0.0.9`, or run manually.
#
# The package contains a cffi/OpenSSL native extension. Mirroring upstream, we
# publish an sdist only (compiled at install time on the user's machine). Building
# an sdist requires no compiler/OpenSSL headers; installers need them.
# Uses PyPI Trusted Publishing (OIDC) — configure a trusted publisher on PyPI for
# this repository + workflow filename (no API token secret required).

'on':
  push:
    tags: ['nemtus-symbol-lightapi@*']
  workflow_dispatch: {}

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi-production
    permissions:
      # required for PyPI Trusted Publishing (OIDC)
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.x'

      - name: Build sdist
        working-directory: lightapi/python
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: lightapi/python/dist
